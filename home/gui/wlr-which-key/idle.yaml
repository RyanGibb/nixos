font: Noto Sans 12
background: "#282828cc"
color: "#ebdbb2"
border: "#83a598"
separator: "  "
border_width: 1
corner_r: 12
padding: 15
anchor: center
inhibit_compositor_keyboard_shortcuts: true

menu:
  - key: i
    desc: Inhibit
    cmd: wm-idle-inhibit
  - key: d
    desc: DPMS
    cmd: wm-idle-dpms
  - key: p
    desc: Presentation on
    cmd: wm-presentation on
  - key: P
    desc: Presentation off
    cmd: wm-presentation off
  - key: l
    desc: Lock
    cmd: wm-idle-lock
  - key: L
    desc: Lock (no DPMS)
    cmd: wm-idle-lock-no-dpms
  - key: s
    desc: Suspend
    cmd: wm-idle-suspend
  - key: S
    desc: Suspend (long)
    cmd: wm-idle-suspend-long
